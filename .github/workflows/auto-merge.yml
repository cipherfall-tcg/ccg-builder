name: Auto merge validated pull requests

on:
  workflow_run:
    workflows: ["CCG Builder validation"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    name: Auto merge / Trusted labeled PR
    # PR-target runs merge in the trusted validation workflow against its exact head.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: [self-hosted, Linux, X64, cipherfall-release]
    timeout-minutes: 5
    steps:
      - name: Merge an opted-in trusted pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          pr_number="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")"
          if [[ -z "$pr_number" ]]; then
            echo "No pull request is associated with this workflow run."
            exit 0
          fi

          pr="$(gh api "repos/$REPOSITORY/pulls/$pr_number")"
          state="$(jq -r '.state' <<<"$pr")"
          draft="$(jq -r '.draft' <<<"$pr")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"$pr")"
          association="$(jq -r '.author_association' <<<"$pr")"
          labels="$(jq -r '[.labels[].name] | index("automerge") != null' <<<"$pr")"

          if [[ "$state" != "open" || "$draft" != "false" || "$head_repo" != "$REPOSITORY" || "$labels" != "true" ]]; then
            echo "PR #$pr_number is not an open, non-draft, same-repository PR labeled automerge."
            exit 0
          fi
          case "$association" in
            OWNER|MEMBER|COLLABORATOR) ;;
            *) echo "PR #$pr_number is not from a trusted collaborator."; exit 0 ;;
          esac

          if [[ -z "$HEAD_SHA" || "$(jq -r '.head.sha' <<<"$pr")" != "$HEAD_SHA" ]]; then
            echo "PR #$pr_number no longer matches the validated head."
            exit 0
          fi

          gh pr merge "$pr_number" --repo "$REPOSITORY" --match-head-commit "$HEAD_SHA" --squash --delete-branch
